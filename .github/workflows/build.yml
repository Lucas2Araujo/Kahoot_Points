name: Build & Create Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da Release (ex: v1.0.0 ou v1.0.0-Alfa)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name=KahootAuto_linux app.py

      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name=KahootAuto_win.exe app.py

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: dist/KahootAuto_linux

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows
          path: dist/KahootAuto_win.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-linux
          path: ./release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-windows
          path: ./release-assets

      - name: Create Release via GitHub CLI
        run: |
          RAW_TAG="${{ inputs.version }}"
          CLEAN_TAG=$(echo "$RAW_TAG" | sed -E 's/[[:space:]]+/-/g; s/-+/-/g' | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$CLEAN_TAG" ]; then
            CLEAN_TAG="v1.0.0"
          fi
          echo "Criando release com tag sanitizada: $CLEAN_TAG"
          gh release create "$CLEAN_TAG" ./release-assets/* --title "Release $RAW_TAG" --notes "Release automatizada contendo os executáveis compilados para Linux e Windows."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
