name: Kahoot Scraper Automation

permissions:
  contents: read

on:
  # 1. Rotina Agendada (Todo sábado às 21:30 UTC -> 18:30 no horário de Brasília)
  schedule:
    - cron: '30 21 * * 6'
  
  # 2. Acionamento Manual com Formulário Visual
  workflow_dispatch:
    inputs:
      kahoot_padrao:
        description: 'Padrão de texto do relatório do Kahoot'
        required: true
        default: ' - Resgate'
      planilha_nome:
        description: 'Nome da Planilha no Google Sheets'
        required: true
        default: 'Resgate_Desempenhov2'

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest # Máquina virtual Linux limpa do GitHub

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install --only-binary :all: --require-hashes -r requirements.txt

      - name: Executar Automação
        # Injeta as variáveis de ambiente na máquina virtual
        env:
          KAHOOT_USER: ${{ secrets.KAHOOT_USER }}
          KAHOOT_PASS: ${{ secrets.KAHOOT_PASS }}
          # O JSON da Conta de Serviço precisa ser colado como string nos Secrets do GitHub
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Usa o valor preenchido no formulário manual OU o valor padrão se for via cron
          KAHOOT_PADRAO: ${{ github.event.inputs.kahoot_padrao || ' - Resgate' }}
          PLANILHA_NOME: ${{ github.event.inputs.planilha_nome || 'Cópia de Resgate_Desempenho' }}
          CI: 'true'
        
        # O modo headless agora é obrigatório para não quebrar a máquina virtual
        run: python app.py